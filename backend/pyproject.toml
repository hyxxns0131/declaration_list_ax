[project]
name = "declaration-list-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: 한글은 폭 2로 세어 문서 문자열이 쉽게 넘침. 줄 길이는 ruff format(100)이 맞춘다.
# UP046/UP047: pydantic Generic 모델은 기존 문법 유지.
ignore = ["E501", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 파라미터 선언(File(...), Form(...))은 기본값 호출이 정상 패턴
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Depends"]
